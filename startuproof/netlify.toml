# Startup Roof rebuild — Netlify configuration.
# Static Astro build + Netlify Functions (v2). No SPA catch-all: unknown paths return a real 404 (404.html).

[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"

[functions]
  node_bundler = "esbuild"

# ---------- Redirects: old routes -> new routes (301) ----------
[[redirects]]
  from = "/forgot-password"
  to = "/forgot/"
  status = 301
[[redirects]]
  from = "/register"
  to = "/signup/"
  status = 301
[[redirects]]
  from = "/help"
  to = "/support/"
  status = 301
[[redirects]]
  from = "/cookies"
  to = "/cookie/"
  status = 301
[[redirects]]
  from = "/news"
  to = "/radar/"
  status = 301
[[redirects]]
  from = "/tv/watch/*"
  to = "/tv/"
  status = 301
  force = false
[[redirects]]
  from = "/dashboard"
  to = "/app/"
  status = 301

# ---------- Headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    # Preview: keep out of search engines until the domain migration is approved.
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Disposition = "attachment"

[[headers]]
  for = "/downloads/*.csv"
  [headers.values]
    Content-Type = "text/csv; charset=utf-8"

[[headers]]
  for = "/downloads/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
